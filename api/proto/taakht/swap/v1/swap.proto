syntax = "proto3";

package taakht.swap.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "taakht/negotiation/v1/negotiation.proto";

option go_package = "github.com/taakht/taakht/gen/taakht/swap/v1;swapv1";
option csharp_namespace = "Taakht.Swap.V1";

enum SwapStatus {
  SWAP_STATUS_UNSPECIFIED = 0;
  // Created from an agreement; the exclusive lock on the ads is being taken.
  SWAP_STATUS_LOCKING = 1;
  // Lock rejected (an ad is gone or changed). Final.
  SWAP_STATUS_REJECTED = 2;
  // Ads locked; waiting for locker fees.
  SWAP_STATUS_AWAITING_PAYMENT = 3;
  SWAP_STATUS_COMPLETED = 4;
  SWAP_STATUS_CANCELLED = 5;
}

message Leg {
  string owner_user_id = 1;
  taakht.negotiation.v1.DeliveryMethod method = 2;
  // Only meaningful for locker legs.
  bool fee_paid = 3;
}

message Swap {
  string id = 1;
  string negotiation_id = 2;
  string ad_a_id = 3;
  string ad_b_id = 4;
  SwapStatus status = 5;
  Leg leg_a = 6;
  Leg leg_b = 7;
  google.protobuf.Timestamp payment_deadline = 8;
  string cancel_reason = 9;
  google.protobuf.Timestamp created_at = 10;
}

service SwapService {
  rpc GetSwap(SwapIdRequest) returns (Swap) {
    option (google.api.http) = {
      get: "/v1/swaps/{swap_id}"
    };
  }
  // The caller's swaps, newest first, one page at a time.
  rpc ListMySwaps(ListMySwapsRequest) returns (ListMySwapsResponse) {
    option (google.api.http) = {
      get: "/v1/swaps"
    };
  }
  // MOCK of the locker partner webhook (LockerFeePaid). Dev only.
  rpc SimulateLockerFeePaid(SimulateLockerFeePaidRequest) returns (Swap) {
    option (google.api.http) = {
      post: "/v1/dev/swaps/{swap_id}/locker-fee-paid:simulate"
      body: "*"
    };
  }
}

message SwapIdRequest {
  string swap_id = 1;
}
message ListMySwapsRequest {
  // Page size: <= 0 means 50, values above 200 are clamped to 200.
  int32 page_size = 1;
  // Opaque cursor from a previous response's next_page_token; empty = first page. INVALID_ARGUMENT if malformed.
  string page_token = 2;
}
message ListMySwapsResponse {
  repeated Swap swaps = 1;
  // Empty when there is no further page.
  string next_page_token = 2;
}
message SimulateLockerFeePaidRequest {
  string swap_id = 1;
  string user_id = 2;
}
