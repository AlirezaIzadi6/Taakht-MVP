# Public API gateway (Envoy): REST/JSON with a JWT from clients -> gRPC to services.
#
# Local MVP: the services run on the host (ports 9001..9004) and Envoy runs in Docker,
# so clusters point at host.docker.internal. The descriptor is built with
# `make gateway-descriptor` (rebuild it and restart Envoy after any .proto change).
#
# This file is the TEMPLATE. `scripts/gen-envoy-config.sh` (run by `make up`) renders it to
# deploy/envoy/envoy.yaml (git-ignored; that is what compose mounts) and writes the JWT key set
# deploy/envoy/jwks.json from JWT_SIGNING_KEY. The renderer only touches the lines tagged with the dev-routes marker
# (dropped unless ENVOY_ENABLE_DEV_ROUTES=true) and the block between the cors-origins markers
# (replaced by ENVOY_CORS_ORIGINS). Rendered with defaults, the dev route is removed.
#
# Adding a service:
#   1. Annotate its RPCs with google.api.http, run `make gateway-descriptor`.
#   2. Add its fully qualified name to the transcoder `services` list.
#   3. Add routes (one path prefix per service: a GET route with retries, then a general one), a cluster
#      and a cluster entry in the health_check filter.
# Internal RPCs (e.g. AdService.LockAds) have no annotation and are not reachable
# (auto_mapping is false; only /v1/ routes exist).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }   # published on 127.0.0.1 only by compose

# Hard cap on all downstream connections of the process (the listener also limits itself to 1000, below).
overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 2000

static_resources:
  listeners:
    - name: public
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      per_connection_buffer_limit_bytes: 1048576
      filter_chains:
        - filters:
            # Cap on concurrent client connections (new ones are closed above the limit).
            - name: envoy.filters.network.connection_limit
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.connection_limit.v3.ConnectionLimit
                stat_prefix: public
                max_connections: 1000
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: public
                use_remote_address: true          # x-forwarded-for / internal-header hygiene: trust the socket, not the client
                normalize_path: true
                merge_slashes: true
                generate_request_id: true         # x-request-id is generated when the client sends none...
                preserve_external_request_id: true   # ...and kept when it does (correlation across a browser and the logs)
                always_set_request_id_in_response: true
                # Limits against slow or oversized clients.
                max_request_headers_kb: 16
                request_headers_timeout: 10s
                request_timeout: 30s              # whole request (headers + body) must arrive within this
                stream_idle_timeout: 30s
                common_http_protocol_options:
                  idle_timeout: 120s              # idle downstream connections are closed
                  max_headers_count: 100
                # One JSON line per request on stdout (docker compose logs envoy).
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          ts: "%START_TIME%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          status: "%RESPONSE_CODE%"
                          grpc_status: "%GRPC_STATUS%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          attempts: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%"
                          duration_ms: "%DURATION%"
                          upstream_ms: "%RESPONSE_DURATION%"
                          response_flags: "%RESPONSE_FLAGS%"
                          response_details: "%RESPONSE_CODE_DETAILS%"
                          user_id: "%REQ(X-USER-ID)%"
                          bytes_in: "%BYTES_RECEIVED%"
                          bytes_out: "%BYTES_SENT%"
                # Errors generated by the edge itself (401 from jwt_authn, 403 from rbac, 404, 413, 503...) use the
                # same JSON shape as service errors: {"code": <grpc code>, "message": "..."}.
                local_reply_config:
                  mappers:
                    - filter: { status_code_filter: { comparison: { op: EQ, value: { default_value: 400, runtime_key: gw.lr.400 } } } }
                      body_format_override: { json_format: { code: 3, message: "%LOCAL_REPLY_BODY%" } }
                    - filter: { status_code_filter: { comparison: { op: EQ, value: { default_value: 401, runtime_key: gw.lr.401 } } } }
                      body_format_override: { json_format: { code: 16, message: "%LOCAL_REPLY_BODY%" } }
                    - filter: { status_code_filter: { comparison: { op: EQ, value: { default_value: 403, runtime_key: gw.lr.403 } } } }
                      body_format_override: { json_format: { code: 7, message: "%LOCAL_REPLY_BODY%" } }
                    - filter: { status_code_filter: { comparison: { op: EQ, value: { default_value: 404, runtime_key: gw.lr.404 } } } }
                      body_format_override: { json_format: { code: 5, message: "not found" } }
                    - filter: { status_code_filter: { comparison: { op: EQ, value: { default_value: 413, runtime_key: gw.lr.413 } } } }
                      body_format_override: { json_format: { code: 8, message: "request body too large" } }
                    - filter: { status_code_filter: { comparison: { op: EQ, value: { default_value: 503, runtime_key: gw.lr.503 } } } }
                      body_format_override: { json_format: { code: 14, message: "%LOCAL_REPLY_BODY%" } }
                    - filter: { status_code_filter: { comparison: { op: EQ, value: { default_value: 504, runtime_key: gw.lr.504 } } } }
                      body_format_override: { json_format: { code: 4, message: "%LOCAL_REPLY_BODY%" } }
                route_config:
                  name: public_routes
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      # Defence in depth: the internal secret must never reach a service from the edge (the lua
                      # filter below already strips it before authentication). Route-level removal runs in the
                      # router, after jwt_authn, so it cannot be used for x-user-id.
                      request_headers_to_remove: ["x-internal-token"]
                      # CORS for browser clients. Credentials (cookies) are off: the JWT travels in the
                      # Authorization header. The cors filter answers allowed preflights itself, before jwt_authn.
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            # @cors-origins-begin
                            - { exact: "http://localhost:3000" }
                            - { exact: "http://127.0.0.1:3000" }
                            # @cors-origins-end
                          allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
                          allow_headers: "authorization,content-type,x-request-id"
                          expose_headers: "x-request-id"
                          max_age: "600"
                          allow_credentials: false
                      # Every route has a 15 s timeout. GETs (idempotent) are retried on connect failure or reset
                      # (2 retries, 5 s each); POST/PUT are never retried because they may have taken effect.
                      routes:
                        - match: { path: "/healthz" }
                          direct_response: { status: 200, body: { inline_string: "ok" } }
                        # /readyz is answered by the health_check filter (needs healthy upstreams in every cluster).
                        - match: { prefix: "/v1/ads", headers: [{ name: ":method", string_match: { exact: GET } }] }
                          route: { cluster: ad_service, timeout: 15s, retry_policy: { retry_on: "connect-failure,reset", num_retries: 2, per_try_timeout: 5s } }
                        - match: { prefix: "/v1/ads" }
                          route: { cluster: ad_service, timeout: 15s }
                        - match: { prefix: "/v1/matching", headers: [{ name: ":method", string_match: { exact: GET } }] }
                          route: { cluster: matching_service, timeout: 15s, retry_policy: { retry_on: "connect-failure,reset", num_retries: 2, per_try_timeout: 5s } }
                        - match: { prefix: "/v1/matching" }
                          route: { cluster: matching_service, timeout: 15s }
                        - match: { prefix: "/v1/negotiations", headers: [{ name: ":method", string_match: { exact: GET } }] }
                          route: { cluster: negotiation_service, timeout: 15s, retry_policy: { retry_on: "connect-failure,reset", num_retries: 2, per_try_timeout: 5s } }
                        - match: { prefix: "/v1/negotiations" }
                          route: { cluster: negotiation_service, timeout: 15s }
                        - match: { prefix: "/v1/swaps", headers: [{ name: ":method", string_match: { exact: GET } }] }
                          route: { cluster: swap_service, timeout: 15s, retry_policy: { retry_on: "connect-failure,reset", num_retries: 2, per_try_timeout: 5s } }
                        - match: { prefix: "/v1/swaps" }
                          route: { cluster: swap_service, timeout: 15s }
                        # DEV ONLY: Swap's locker simulation. Rendered in only when ENVOY_ENABLE_DEV_ROUTES=true.
                        - { match: { prefix: "/v1/dev/swaps/" }, route: { cluster: swap_service, timeout: 15s } }   # @dev-routes
                        # Anything else (unknown path, or a disabled dev route): JSON 404 (see local_reply_config).
                        - match: { prefix: "/" }
                          direct_response: { status: 404, body: { inline_string: "not found" } }
                http_filters:
                  # First: drop client-supplied identity headers BEFORE jwt_authn. claim_to_headers only
                  # overwrites x-user-id when the token has a `sub`, so a signed token without `sub` would
                  # otherwise keep a client-chosen x-user-id.
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(handle)
                            -- Liveness is answered here: the transcoder below would reject non-API paths with 404.
                            if handle:headers():get(":path") == "/healthz" then
                              handle:respond({[":status"] = "200", ["content-type"] = "text/plain"}, "ok")
                              return
                            end
                            handle:headers():remove("x-user-id")
                            handle:headers():remove("x-internal-token")
                            if handle:headers():get(":method") == "OPTIONS" then
                              handle:streamInfo():dynamicMetadata():set("gw", "options", "1")
                            end
                          end

                          -- The cors filter answers an allowed preflight with 200; the API contract (and most clients) use 204.
                          function envoy_on_response(handle)
                            local md = handle:streamInfo():dynamicMetadata():get("gw")
                            if md ~= nil and md["options"] == "1" and handle:headers():get(":status") == "200"
                               and handle:headers():get("access-control-allow-origin") ~= nil then
                              handle:headers():replace(":status", "204")
                            end
                          end
                  # Preflight (OPTIONS + Origin + Access-Control-Request-Method) from an allowed origin is answered
                  # here without a JWT; CORS response headers are added to normal responses of allowed origins.
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  # GET /readyz: 200 only when every cluster has healthy upstreams (active health checks below), else 503.
                  - name: envoy.filters.http.health_check
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                      pass_through_mode: false
                      headers:
                        - { name: ":path", string_match: { exact: "/readyz" } }
                      cluster_min_healthy_percentages:
                        ad_service: { value: 100 }
                        matching_service: { value: 100 }
                        negotiation_service: { value: 100 }
                        swap_service: { value: 100 }
                  # Every /v1/ route requires a valid JWT. On success the `sub` claim
                  # is written to x-user-id, replacing any value the client sent.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      bypass_cors_preflight: true
                      providers:
                        dev:
                          issuer: taakht-dev
                          audiences: ["taakht-api"]
                          claim_to_headers:
                            - header_name: x-user-id
                              claim_name: sub
                          # The HS256 key set is NOT in the repo: scripts/gen-envoy-config.sh writes it from
                          # JWT_SIGNING_KEY (default: the public dev key, which tools/devtoken also defaults to).
                          # Several keys with `kid` may be listed to rotate without invalidating live tokens.
                          local_jwks:
                            filename: /etc/envoy/jwks.json
                      rules:
                        - match: { prefix: "/v1/" }
                          requires: { provider_name: dev }
                  # jwt_authn cannot filter claims by prefix, so check the x-user-id header it just wrote:
                  # deny a `system:` subject (case-insensitive; system identities are for service-to-service
                  # calls only) and deny a /v1/ request that ended up with no x-user-id (token without `sub`).
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: DENY
                        policies:
                          no_system_subject:
                            permissions: [{ any: true }]
                            principals:
                              - header:
                                  name: x-user-id
                                  string_match: { prefix: "system:", ignore_case: true }
                          missing_subject:
                            permissions:
                              - url_path: { path: { prefix: "/v1/" } }
                            principals:
                              - not_id:
                                  header: { name: x-user-id, present_match: true }
                  # Request bodies above 1 MiB are rejected with 413.
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 1048576
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/descriptor.binpb
                      services:
                        - taakht.ad.v1.AdService
                        - taakht.matching.v1.MatchingService
                        - taakht.negotiation.v1.NegotiationService
                        - taakht.swap.v1.SwapService
                      auto_mapping: false
                      # Required: without it the route is re-matched on the rewritten
                      # /pkg.Service/Method path and every transcoded call returns 404.
                      match_incoming_request_route: true
                      ignore_unknown_query_parameters: true
                      convert_grpc_status: true
                      # A path under a service prefix that maps to no RPC is a JSON 404, not a pass-through (415).
                      request_validation_options:
                        reject_unknown_method: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ad_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY   # host.docker.internal also resolves to an unroutable IPv6 address
      connect_timeout: 2s
      circuit_breakers:
        thresholds: [{ max_connections: 100, max_pending_requests: 512, max_requests: 1024, max_retries: 10 }]
      # Active health check: plain TCP connect. Switch to `grpc_health_check: {}` once all four services expose
      # grpc.health.v1 (the Go services do via libs/goplatform/observe; the .NET ones do not yet).
      health_checks:
        - { timeout: 2s, interval: 5s, interval_jitter: 1s, unhealthy_threshold: 2, healthy_threshold: 1, tcp_health_check: {} }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options: { idle_timeout: 60s }
          explicit_http_config: { http2_protocol_options: { connection_keepalive: { interval: 30s, timeout: 5s } } }   # gRPC requires HTTP/2
      load_assignment:
        cluster_name: ad_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9001 }
    - name: matching_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY   # host.docker.internal also resolves to an unroutable IPv6 address
      connect_timeout: 2s
      circuit_breakers:
        thresholds: [{ max_connections: 100, max_pending_requests: 512, max_requests: 1024, max_retries: 10 }]
      health_checks:
        - { timeout: 2s, interval: 5s, interval_jitter: 1s, unhealthy_threshold: 2, healthy_threshold: 1, tcp_health_check: {} }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options: { idle_timeout: 60s }
          explicit_http_config: { http2_protocol_options: { connection_keepalive: { interval: 30s, timeout: 5s } } }   # gRPC requires HTTP/2
      load_assignment:
        cluster_name: matching_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9002 }
    - name: negotiation_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY   # host.docker.internal also resolves to an unroutable IPv6 address
      connect_timeout: 2s
      circuit_breakers:
        thresholds: [{ max_connections: 100, max_pending_requests: 512, max_requests: 1024, max_retries: 10 }]
      health_checks:
        - { timeout: 2s, interval: 5s, interval_jitter: 1s, unhealthy_threshold: 2, healthy_threshold: 1, tcp_health_check: {} }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options: { idle_timeout: 60s }
          explicit_http_config: { http2_protocol_options: { connection_keepalive: { interval: 30s, timeout: 5s } } }   # gRPC requires HTTP/2
      load_assignment:
        cluster_name: negotiation_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9003 }
    - name: swap_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY   # host.docker.internal also resolves to an unroutable IPv6 address
      connect_timeout: 2s
      circuit_breakers:
        thresholds: [{ max_connections: 100, max_pending_requests: 512, max_requests: 1024, max_retries: 10 }]
      health_checks:
        - { timeout: 2s, interval: 5s, interval_jitter: 1s, unhealthy_threshold: 2, healthy_threshold: 1, tcp_health_check: {} }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options: { idle_timeout: 60s }
          explicit_http_config: { http2_protocol_options: { connection_keepalive: { interval: 30s, timeout: 5s } } }   # gRPC requires HTTP/2
      load_assignment:
        cluster_name: swap_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9004 }
