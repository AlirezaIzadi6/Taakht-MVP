# Public API gateway (Envoy): REST/JSON with a JWT from clients -> gRPC to services.
#
# Local MVP: the services run on the host (ports 9001..9004) and Envoy runs in Docker,
# so clusters point at host.docker.internal. The descriptor is built with
# `make gateway-descriptor` (rebuild it and restart Envoy after any .proto change).
#
# Adding a service:
#   1. Annotate its RPCs with google.api.http, run `make gateway-descriptor`.
#   2. Add its fully qualified name to the transcoder `services` list.
#   3. Add a route (one path prefix per service) and a cluster.
# Internal RPCs (e.g. AdService.LockAds) have no annotation and are not reachable
# (auto_mapping is false; only /v1/ routes exist).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }   # published on 127.0.0.1 only by compose

static_resources:
  listeners:
    - name: public
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: public
                route_config:
                  name: public_routes
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      # Defence in depth: the internal secret must never reach a service from the edge (the lua
                      # filter below already strips it before authentication). Route-level removal runs in the
                      # router, after jwt_authn, so it cannot be used for x-user-id.
                      request_headers_to_remove: ["x-internal-token"]
                      routes:
                        - match: { path: "/healthz" }
                          direct_response: { status: 200, body: { inline_string: "ok" } }
                        - match: { prefix: "/v1/ads" }
                          route: { cluster: ad_service }
                        - match: { prefix: "/v1/matching" }
                          route: { cluster: matching_service }
                        - match: { prefix: "/v1/negotiations" }
                          route: { cluster: negotiation_service }
                        - match: { prefix: "/v1/swaps" }
                          route: { cluster: swap_service }
                        # Swap also owns the dev-only locker simulation.
                        - match: { prefix: "/v1/dev/swaps/" }
                          route: { cluster: swap_service }
                http_filters:
                  # First: drop client-supplied identity headers BEFORE jwt_authn. claim_to_headers only
                  # overwrites x-user-id when the token has a `sub`, so a signed token without `sub` would
                  # otherwise keep a client-chosen x-user-id.
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(handle)
                            handle:headers():remove("x-user-id")
                            handle:headers():remove("x-internal-token")
                          end
                  # Every /v1/ route requires a valid JWT. On success the `sub` claim
                  # is written to x-user-id, replacing any value the client sent.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        dev:
                          issuer: taakht-dev
                          audiences: ["taakht-api"]
                          claim_to_headers:
                            - header_name: x-user-id
                              claim_name: sub
                          # DEV ONLY secret: taakht-dev-secret-0123456789abcdef (tools/devtoken signs with it).
                          local_jwks:
                            inline_string: '{"keys":[{"kty":"oct","alg":"HS256","k":"dGFha2h0LWRldi1zZWNyZXQtMDEyMzQ1Njc4OWFiY2RlZg"}]}'
                      rules:
                        - match: { prefix: "/v1/" }
                          requires: { provider_name: dev }
                  # jwt_authn cannot filter claims by prefix, so check the x-user-id header it just wrote:
                  # deny a `system:` subject (case-insensitive; system identities are for service-to-service
                  # calls only) and deny a /v1/ request that ended up with no x-user-id (token without `sub`).
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: DENY
                        policies:
                          no_system_subject:
                            permissions: [{ any: true }]
                            principals:
                              - header:
                                  name: x-user-id
                                  string_match: { prefix: "system:", ignore_case: true }
                          missing_subject:
                            permissions:
                              - url_path: { path: { prefix: "/v1/" } }
                            principals:
                              - not_id:
                                  header: { name: x-user-id, present_match: true }
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/descriptor.binpb
                      services:
                        - taakht.ad.v1.AdService
                        - taakht.matching.v1.MatchingService
                        - taakht.negotiation.v1.NegotiationService
                        - taakht.swap.v1.SwapService
                      auto_mapping: false
                      # Required: without it the route is re-matched on the rewritten
                      # /pkg.Service/Method path and every transcoded call returns 404.
                      match_incoming_request_route: true
                      ignore_unknown_query_parameters: true
                      convert_grpc_status: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ad_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY   # host.docker.internal also resolves to an unroutable IPv6 address
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }   # gRPC requires HTTP/2
      load_assignment:
        cluster_name: ad_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9001 }
    - name: matching_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY   # host.docker.internal also resolves to an unroutable IPv6 address
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }   # gRPC requires HTTP/2
      load_assignment:
        cluster_name: matching_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9002 }
    - name: negotiation_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY   # host.docker.internal also resolves to an unroutable IPv6 address
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }   # gRPC requires HTTP/2
      load_assignment:
        cluster_name: negotiation_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9003 }
    - name: swap_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY   # host.docker.internal also resolves to an unroutable IPv6 address
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }   # gRPC requires HTTP/2
      load_assignment:
        cluster_name: swap_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9004 }
